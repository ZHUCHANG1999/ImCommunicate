version: '3'

services:
  etcd:
    image: bitnami/etcd:3.4.15
    container_name: etcd
    ports:
      - "3379:2379"
      - "3380:2380"
    environment:
      - ETCD_ENABLE_V2=true
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://192.168.10.128:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_NAME=etcd
    volumes:
      - ./components/etcd/data:/bitnami/etcd/data
      - ./components/etcd/logs:/bitnami/etcd/logs
    networks:
      easy-im:

  redis:
    image: redis:alpine3.18
    ports:
      - 6379:6379
    container_name: myredis
    volumes:
      - ./components/redis/data:/data
      - ./components/redis/config/redis.conf；/user/local/redis/config/redis.conf
    environment:
      TZ: Asia/Shanghai
    restart: always
    networks:
      easy-im:
    command: redis-server --requirepass easy-im --appendonly yes

  mysql:
    image: mysql:8.3
    ports:
      - 3306:3306
    container_name: mysql
    volumes:
      - ./components/mysql/data:/var/lib/mysql
      - /etc/localtime:/etc/localtime
    environment:
      MYSQL_ROOT_PASSWORD: a12bCd3_W45pUq6
    restart: always
    networks:
      easy-im:

networks:
  easy-im:
    driver: bridge
